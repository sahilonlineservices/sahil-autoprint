<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Print • Track Order</title><style>body{margin:0;background:#f4f7fb;font-family:Inter,system-ui;color:#14213d}.card{width:min(560px,calc(100% - 30px));margin:35px auto;background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:25px;box-shadow:0 18px 55px #14213d12}.head{text-align:center;border-bottom:1px dashed #ccd5e3;padding-bottom:16px}.head h1{margin:0}.field{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dce3ee;border-radius:12px;margin-top:7px;font-size:15px}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#14213d;color:#fff;font-weight:800;font-size:15px;margin-top:13px;cursor:pointer}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #edf0f5}.row span{color:#68758b}.status{margin:18px 0;padding:14px;border-radius:14px;background:#eef3ff;font-weight:800;text-align:center}.error{display:none;background:#fff0f0;color:#b42318;padding:12px;border-radius:10px;margin-top:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.link{display:block;text-align:center;padding:12px;border:1px solid #dce3ee;border-radius:12px;color:#14213d;text-decoration:none;font-weight:800}@media(max-width:500px){.actions{grid-template-columns:1fr}}</style></head><body><main class="card"><div class="head"><h1>AUTO PRINT</h1><p>Track your print order</p></div><div style="margin-top:20px"><label>Order ID</label><input id="order" class="field" placeholder="APO-..."><label style="display:block;margin-top:12px">Mobile Number</label><input id="mobile" class="field" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><button class="btn" id="find">Check Order</button><div id="error" class="error"></div></div><section id="result" style="display:none;margin-top:22px"><div id="status" class="status"></div><div class="row"><span>Shop</span><strong id="shop"></strong></div><div class="row"><span>Order ID</span><strong id="oid"></strong></div><div class="row"><span>Print</span><strong id="print"></strong></div><div class="row"><span>Pages / Copies</span><strong id="pages"></strong></div><div class="row"><span>Amount</span><strong id="amount"></strong></div><div class="row"><span>Payment</span><strong id="payment"></strong></div><div class="actions"><a id="receipt" class="link" target="_blank">🧾 Receipt</a><a href="index.html" class="link">New Order</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="track.js"></script></body></html>
