<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Print Receipt</title><style>body{margin:0;background:#f3f6fb;font-family:Arial;color:#162137}.card{width:min(560px,calc(100% - 28px));margin:30px auto;background:#fff;border:1px solid #e1e6ef;border-radius:20px;padding:24px;box-shadow:0 15px 45px #16213715}.head{text-align:center;border-bottom:1px dashed #ccd4e1;padding-bottom:16px}.head h1{margin:0}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf0f5}.row span{color:#66738a}.paid{color:#16834b;font-weight:800}.btns{display:flex;gap:10px;margin-top:18px}.btn{flex:1;padding:13px;border:0;border-radius:12px;background:#162137;color:#fff;font-weight:800;cursor:pointer}.error{background:#fff0f0;color:#b42318;padding:12px;border-radius:10px;display:none}@media print{body{background:#fff}.card{box-shadow:none;border:0;margin:0;width:auto}.btns{display:none}}</style></head><body><main class="card"><div class="head"><h1>AUTO PRINT</h1><p>Payment Receipt</p></div><div id="error" class="error"></div><div id="receipt">Loading…</div><div class="btns"><button class="btn" onclick="window.print()">🖨 Print Receipt</button><button class="btn" onclick="location.href='index.html'">Done</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="receipt.js"></script></body></html>
